[package]
name = "voice-changer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Real-time open-source voice changer"

[[bin]]
name = "voice-changer"
path = "src/main.rs"

[features]
default = []
onnx = ["rustvc-infer/onnx"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rustvc-audio = { path = "../rustvc-audio" }
rustvc-infer = { path = "../rustvc-infer" }
rustvc-train = { path = "../rustvc-train" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = "2.12"
zip = "2.2"

[build-dependencies]
winresource = "0.1"
